<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адвент-календарь «Наш уютный декабрь»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EF; --paper:#FFFDF9; --ink:#2B3A33; --muted:#6E7B73;
    --pine:#2F4A3F; --terracotta:#C8664B; --sage:#A9BFA8; --mustard:#E0B15C;
    --blush:#EBC9BC; --sky:#BFD3DA; --line:#E8DFD2;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;min-height:100vh}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}

  header{text-align:center;margin-bottom:26px}
  .brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--terracotta);font-weight:700}
  h1{font-family:'Lora',serif;font-weight:600;font-size:clamp(28px,5vw,46px);line-height:1.15;margin:10px 0 10px;color:var(--pine)}
  h1 em{font-style:italic;color:var(--terracotta)}
  .lead{max-width:580px;margin:0 auto;color:var(--muted);font-size:16px}

  .progress{display:flex;align-items:center;gap:14px;max-width:520px;margin:22px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:10px 18px}
  .bar{flex:1;height:8px;background:#EFE7DB;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--pine));border-radius:99px;transition:width .5s}
  .progress b{font-size:14px;white-space:nowrap}

  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 24px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px;border-radius:99px;background:var(--paper);border:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:50%}

  .grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:118px;grid-auto-flow:dense;gap:12px}
  @media(max-width:760px){.grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:92px;gap:9px}}
  @media(max-width:420px){.grid{grid-template-columns:repeat(3,1fr);grid-auto-rows:96px}}
  .cell{position:relative;border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;color:var(--ink);perspective:800px;background:transparent;padding:0;text-align:left}
  .cell.w2{grid-column:span 2}.cell.h2{grid-row:span 2}
  .door,.inside{position:absolute;inset:0;border-radius:var(--radius);display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px;overflow:hidden}
  .inside{background:var(--paper);border:1.5px dashed var(--line)}
  .door{transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.3,1),box-shadow .3s;box-shadow:0 2px 0 rgba(0,0,0,.06);z-index:2}
  .cell:hover .door{box-shadow:0 8px 20px rgba(47,74,63,.16)}
  .cell.opened .door{transform:rotateY(-78deg);box-shadow:none}
  .num{font-family:'Lora',serif;font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1}
  .cell.h2 .num,.cell.w2 .num{font-size:clamp(36px,6vw,60px)}
  .door small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:600}
  .deco{position:absolute;right:10px;bottom:8px;width:34%;max-width:64px;opacity:.9}
  .lock{position:absolute;top:10px;right:10px;width:16px;height:16px;opacity:.55}
  .cell.locked{cursor:default}
  .cell.locked .door{filter:saturate(.75)}
  .cell.today .door{outline:3px solid var(--terracotta);outline-offset:3px;animation:pulse 2.4s infinite}
  @keyframes pulse{50%{outline-color:rgba(200,102,75,.25)}}
  .inside .ttl{font-size:13px;font-weight:600;line-height:1.3}
  @media(max-width:420px){.inside .ttl{font-size:11.5px}}
  .badge{align-self:flex-end;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px}
  .badge.done{color:var(--pine);background:#E4EDE3}
  .badge.inspired{color:#8A5A12;background:#FBEFD3}
  .badge.later{color:var(--muted);background:#F1ECE4}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .overlay{position:fixed;inset:0;background:rgba(43,58,51,.45);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  @media(min-width:640px){.overlay{align-items:center;padding:20px}}
  .modal{background:var(--paper);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:26px 22px 24px;animation:up .35s ease}
  @media(min-width:640px){.modal{border-radius:24px;padding:28px 28px 26px}}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  .m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .m-day{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--terracotta)}
  .m-title{font-family:'Lora',serif;font-size:26px;line-height:1.2;color:var(--pine);margin-top:4px}
  .close{border:none;background:#F2ECE2;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--ink);flex-shrink:0}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
  .meta span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:#F4EEE5}
  .block{margin-top:14px;padding:14px 16px;border-radius:16px}
  .block h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .block p+p,.block p+ul,.block ul+p,.block p+ol,.block ol+p,.block h5+ul,.block h5+ol{margin-top:8px}
  .block h5{font-size:14px;margin-top:12px;color:var(--pine)}
  .block ul,.block ol{padding-left:20px}
  .block li{margin:3px 0}
  .b-task{background:#EEF3EC}.b-task h4{color:var(--pine)}
  .b-light{background:#FAEDE7}.b-light h4{color:var(--terracotta)}
  .b-why{background:#F6F0E3}.b-why h4{color:#9A7524}
  .b-bonus{background:#F1F5F7}.b-bonus h4{color:#3E6372}
  .b-mat{background:transparent;border:1.5px dashed var(--line);display:flex;gap:12px;align-items:center;padding:12px 14px}
  .b-mat .ic{font-size:22px}
  .b-mat b{display:block;font-size:14px}
  .b-mat span{font-size:12.5px;color:var(--muted)}
  .b-mat a{color:var(--terracotta);font-weight:700;font-size:13px}
  .note-label{display:block;margin-top:18px;font-size:13px;font-weight:600;color:var(--muted)}
  .note{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:inherit;font-size:14px;resize:vertical;min-height:80px;background:#fff;color:var(--ink)}
  .status-label{margin-top:18px;font-size:13px;font-weight:600;color:var(--muted)}
  .status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .st{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 6px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);line-height:1.25}
  .st[aria-pressed="true"][data-s="done"]{background:var(--pine);border-color:var(--pine);color:#fff}
  .st[aria-pressed="true"][data-s="inspired"]{background:var(--mustard);border-color:var(--mustard);color:#3d2b05}
  .st[aria-pressed="true"][data-s="later"]{background:#E9E2D6;border-color:#D8CDBB}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--pine);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}

  footer{margin-top:34px;text-align:center;font-size:13px;color:var(--muted)}
  footer p{max-width:520px;margin:0 auto}
  footer button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-family:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;margin:10px 4px 0}
  .admin{display:inline-block;margin-top:10px;font-size:12px;padding:4px 10px;border-radius:99px;background:#FFF1C9;color:#7A5B10;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="progress"><div class="bar"><i id="bar"></i></div><b id="count"></b></div>
  </header>

  <div class="legend" id="legend"></div>
  <main class="grid" id="grid"></main>

  <footer>
    <p id="footText"></p>
    <button id="resetBtn">Сбросить мои отметки и заметки</button>
    <span id="previewWrap"></span>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="m-top">
      <div><div class="m-day" id="mDay"></div><div class="m-title" id="mTitle"></div></div>
      <button class="close" id="mClose" aria-label="Закрыть">×</button>
    </div>
    <div class="meta" id="mMeta"></div>
    <div id="mBody"></div>
    <label class="note-label" for="mNote" id="mNoteLabel"></label>
    <textarea class="note" id="mNote"></textarea>
    <div class="status-label">Как прошёл этот день? (по желанию)</div>
    <div class="status">
      <button class="st" data-s="done">Сделали ✓</button>
      <button class="st" data-s="inspired">Просто вдохновились</button>
      <button class="st" data-s="later">Сохраним на другой день</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   1. НАСТРОЙКИ
   ===================================================================== */
const CONFIG = {
  brand: "neprostodeti",
  title: "Наш <em>уютный</em> декабрь",
  lead:  "Не ещё один марафон, а 31 маленький повод создать семейные традиции, добрые воспоминания и новогоднее настроение. Все задания — по желанию.",
  footer:"Прошедшие дни остаются открытыми — возвращайтесь к ним в любом порядке. Здесь нет отставаний и «долгов»: ваш декабрь — ваш темп.",
  startDate: "2026-12-01",
  days: 31,
  timeZone: "Europe/Moscow",          // единый часовой пояс открытия ячеек
  bigCells:  [1, 12, 19, 31],          // большие ячейки 2×2
  wideCells: [5, 6, 13, 20, 26, 27],   // широкие — выходные с более длинными заданиями
  storageKey: "advent-neprostodeti-2026",
  previewHash: "#preview"              // предпросмотр всех ячеек: ссылка с #preview в конце
};

const CATEGORIES = {
  ritual: { name: "Ритуалы и уют",     color: "#E0B15C" },
  words:  { name: "Тёплые слова",      color: "#EBC9BC" },
  play:   { name: "Игра и творчество", color: "#A9BFA8" },
  kind:   { name: "Доброта и забота",  color: "#BFD3DA" },
  dreams: { name: "Мечты и итоги",     color: "#D9C3A5" }
};

/* Типы ответа → подпись поля заметки */
const ANSWERS = {
  note:    { label: "Заметка (можно оставить пустой)", ph: "Пара слов о сегодняшнем дне…" },
  list:    { label: "Наш список — можно дополнять и перечитывать", ph: "Каждую идею — с новой строки…" },
  photo:   { label: "Заметка к фото", ph: "Что получилось, что запомнилось…" },
  choice:  { label: "Что выбрали", ph: "Наш выбор и пара слов о нём…" },
  check:   { label: "Список договорённостей", ph: "Кто за что отвечает — каждый пункт с новой строки…" },
  private: { label: "Личная заметка — видна только вам", ph: "Можно ничего не писать…" }
};

/* =====================================================================
   2. ЗАДАНИЯ
   Поля: title, category, task, light (если мало сил), why,
   material (название шаблона), materialUrl (ссылка, когда шаблон будет готов),
   bonus (HTML — готовые списки и тексты), answer (тип ответа)
   ===================================================================== */
const TASKS = [
{ title:"Зажигаем декабрь", category:"ritual", answer:"note",
  task:"Сегодня мы начинаем не гонку к Новому году, а наш собственный уютный декабрь. Соберитесь на несколько минут и придумайте маленький знак начала праздника: включать гирлянду перед ужином, заваривать чай в любимых кружках или каждый вечер спрашивать друг друга, что сегодня порадовало. Выберите один ритуал, который хочется повторять.",
  light:"Включите огоньки и побудьте рядом одну минуту.",
  why:"Почему детям запоминаются повторяющиеся семейные ритуалы: знакомые детали, предвкушение и чувство «мы вместе».",
  material:"Карточка «Наш декабрь начинается с…»" },

{ title:"Баночка маленьких радостей", category:"ritual", answer:"list",
  task:"Придумайте вместе пять простых зимних удовольствий. Например, какао после прогулки, танец на кухне, настольная игра, сказка под пледом или смешная фотография. Запишите каждую идею на отдельной бумажке и сложите в баночку. Когда захочется немного праздника, вытягивайте одну.",
  light:"Придумайте одну приятную идею.",
  why:"Радость не обязательно планировать дорого и масштабно; маленькие моменты тоже становятся традициями.",
  material:"Пять карточек для баночки",
  bonus:`<p>Идеи, если сложно начать:</p><ul><li>какао после прогулки</li><li>украшать дом</li><li>читать новогодние рассказы</li><li>смотреть новогодние фильмы</li></ul>` },

{ title:"Ищем новогодний вайб", category:"play", answer:"photo",
  task:"Выйдите вместе на короткую прогулку по своему району или городу. Ищите не «самую красивую ёлку», а то, от чего лично у вас появляется новогоднее настроение: витрину, гирлянду, смешного снеговика, запах выпечки или украшенный подъезд. Сделайте одно фото — «Вот таким наш декабрь кажется сегодня».",
  light:"Заметьте одну праздничную деталь по дороге по делам.",
  why:"Совместные впечатления возникают, когда мы замечаем одни и те же мелочи и делимся ими.",
  material:"Рамка для фото «Наш новогодний вайб» — вклейте фото или дорисуйте что-то вокруг" },

{ title:"Три добрых слова", category:"words", answer:"note",
  task:"Скажите ребёнку три конкретные добрые вещи. Не про оценки и достижения, а про него самого: «Мне нравится, как ты умеешь придумывать игры», «С тобой уютно разговаривать», «Я люблю твой смех». Предложите ему сказать вам что-нибудь тёплое в ответ — только если захочет. Можно нарисовать или показать жестом.",
  light:"Скажите одну искреннюю фразу.",
  why:"Внимание к человеку важнее общих похвал. Тёплые слова не нужно «заслуживать» и возвращать по требованию.",
  bonus:`<p>Примеры конкретных добрых слов:</p><ul>
    <li>Ты замечательный собеседник, с тобой всегда интересно.</li>
    <li>Ты очень заботливый и умеешь думать о других.</li>
    <li>У тебя получаются невероятно вкусные блюда.</li>
    <li>У тебя прекрасное чувство юмора, ты умеешь поднимать настроение.</li>
    <li>Ты очень добрый, и у тебя большое сердце.</li>
    <li>Ты умеешь находить интересные решения даже в сложных ситуациях.</li>
    <li>Мне нравится, как ты рассуждаешь и отстаиваешь своё мнение.</li>
    <li>Ты очень надёжный человек, на тебя можно положиться.</li>
    <li>Ты умеешь замечать то, на что другие даже не обращают внимания.</li>
    <li>С тобой очень хорошо и спокойно, я рада, что ты есть в моей жизни.</li></ul>` },

{ title:"Наш домашний кинотеатр", category:"play", answer:"choice",
  task:"Выберите вместе новогодний фильм или мультфильм из готового списка. Подготовьте самый простой кинотеатр дома: плед, удобные места и, если хочется, мандарины или попкорн. Пусть ребёнок решит, как назвать ваш кинотеатр. Главное — смотреть вместе, а не успеть всё идеально организовать.",
  light:"Посмотрите одну короткую праздничную историю.",
  why:"Часто детям важнее не само кино, а ощущение, что взрослый никуда не спешит и смотрит вместе с ними.",
  material:"Билеты в домашний кинотеатр",
  bonus:`<h5>Фильмы</h5><ol><li>«Гарри Поттер» (все части)</li><li>«Один дома»</li><li>«Карнавальная ночь»</li><li>«Тариф новогодний»</li><li>«Санта Клаус»</li></ol>
    <h5>Мультфильмы</h5><ol><li>«Зима в Простоквашино»</li><li>«Падал прошлогодний снег»</li><li>«Щелкунчик и волшебная флейта»</li><li>«Холодное сердце»</li><li>«Когда зажигаются ёлки»</li></ol>
    <p style="font-size:13px;color:#6E7B73">Перед просмотром проверьте возрастную маркировку — она подойдёт не всем детям одинаково.</p>` },

{ title:"Аромат нашего Нового года", category:"ritual", answer:"choice",
  task:"Как пахнет праздник именно в вашей семье? Мандаринами, хвоей, свежей выпечкой, корицей или чем-то совсем другим? Выберите вместе один приятный запах и устройте маленькую ароматную минуту: очистите мандарин, достаньте веточку хвои или приготовьте чай. Спросите друг друга, с чем этот аромат ассоциируется. Может быть, он станет вашей новой традицией.",
  light:"Понюхайте мандарин и назовите своё воспоминание.",
  why:"Запахи нередко помогают вспоминать события и эмоции. У каждого свой праздничный аромат; не используем сильные запахи, если кому-то неприятно.",
  material:"Карточка «Праздник пахнет…»",
  bonus:`<p>Идеи:</p><ul><li>мандарин</li><li>свечка с ароматом печенья</li><li>еловые ветки</li><li>шоколадные конфеты</li><li>какао</li></ul>` },

{ title:"Мечта, которую можно приблизить", category:"dreams", answer:"note",
  task:"Вспомните вместе одну небольшую приятную вещь, которую давно хотелось сделать: испечь что-то новое, начать альбом, освоить игру, побывать в интересном месте. Не нужно срочно всё исполнять. Выберите один простой первый шаг: найти рецепт, договориться о дне или достать из шкафа материалы.",
  light:"Просто назовите желание и сохраните его.",
  why:"Для нового начала не обязательно дожидаться 1 января и ставить большие цели.",
  material:"Карточка «Маленькая мечта — первый шаг»" },

{ title:"Праздник, в котором отдыхают все", category:"kind", answer:"check",
  task:"Представьте новогодний день, когда никому не приходится весь вечер бегать между кухней и столом. Спросите членов семьи, что каждому по силам и хочется взять на себя: украсить стол, выбрать музыку, разложить салфетки, подготовить напитки. Запишите несколько договорённостей заранее, чтобы 31 декабря осталось время не только на дела, но и на радость.",

  bonus:`<h5>🍓 Что понадобится</h5><ul><li>2 мандарина</li><li>1 яблоко</li><li>1 груша</li><li>2 киви</li><li>1 банан</li><li>немного винограда или ягод</li><li>красивая большая тарелка</li></ul>

  task:"Выберите вместе три момента года: один радостный, один смешной и один, когда вы поддержали друг друга. Можно найти фотографии, нарисовать картинки или просто рассказать истории. Не нужно называть год прекрасным, если он был трудным: ценно то хорошее, что всё-таки случалось.",
  light:"Вспомните один момент.",
  why:"У воспоминаний бывают разные оттенки; благодарность не требует отрицать сложности.",
  material:"Шаблон коллажа из трёх кадров" },

{ title:"Что оставим с собой", category:"dreams", answer:"choice",
  task:"Полистайте свои декабрьские фотографии и заметки или просто поговорите. Что вам хотелось бы повторить в следующем году? Может, домашнее кино, смешной завтрак, прогулку или семейный пароль. Выберите одну идею, которую приятно оставить с собой. Не нужно подсчитывать выполненные задания.",
  light:"Назовите один любимый момент декабря.",
  why:"Хорошие привычки растут из приятного опыта, а не из принуждения.",
  material:"Страница «Наше лучшее открытие декабря»" },

{ title:"Пусть этот вечер будет нашим", category:"ritual", answer:"note",
  task:"Сегодня никаких новых дел. Всё важное для праздника вы уже сделали — или не сделали, и это тоже не беда. Перед Новым годом найдите пару минут и скажите друг другу одно доброе пожелание. Можно просто включить огоньки, посмотреть на украшенный дом и почувствовать: мы были вместе. С Новым годом!",
  light:"Посмотрите друг на друга и улыбнитесь — этого достаточно.",
  why:"Праздник не оценивают по списку дел; самое ценное — близость и надежда.",
  material:"Финальная открытка" }
];

/* =====================================================================
   3. ЛОГИКА — менять не нужно
   ===================================================================== */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storageKey)) || {}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(v)); }catch(e){} }
};
let state = store.get(); state.opened ||= {}; state.status ||= {}; state.notes ||= {};
const preview = location.hash === CONFIG.previewHash;

const DECOS = [
  `<svg viewBox="0 0 60 60"><path d="M30 6l14 22h-8l12 18H12l12-18h-8z" fill="rgba(47,74,63,.55)"/><rect x="27" y="46" width="6" height="8" fill="rgba(47,74,63,.55)"/></svg>`,
  `<svg viewBox="0 0 60 60" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linecap="round"><path d="M30 8v44M11 19l38 22M11 41l38-22"/><path d="M24 12l6 6 6-6M24 48l6-6 6 6"/></svg>`,
  `<svg viewBox="0 0 60 60"><circle cx="30" cy="34" r="17" fill="rgba(200,102,75,.6)"/><rect x="26" y="12" width="8" height="7" rx="2" fill="rgba(47,74,63,.5)"/><path d="M14 32c10 5 22 5 32 0" stroke="rgba(255,255,255,.7)" stroke-width="3" fill="none"/></svg>`,
  `<svg viewBox="0 0 60 60"><path d="M30 50s-18-10-18-24a10 10 0 0118-6 10 10 0 0118 6c0 14-18 24-18 24z" fill="rgba(200,102,75,.55)"/></svg>`,
  `<svg viewBox="0 0 60 60"><path d="M30 8l5.6 13.6L50 23l-11 9.6L42.4 47 30 39.4 17.6 47 21 32.6 10 23l14.4-1.4z" fill="rgba(255,255,255,.75)"/></svg>`,
  `<svg viewBox="0 0 60 60"><rect x="12" y="24" width="36" height="26" rx="3" fill="rgba(47,74,63,.45)"/><rect x="10" y="18" width="40" height="9" rx="2" fill="rgba(200,102,75,.6)"/><path d="M30 18v32" stroke="#fff" stroke-width="3"/><path d="M30 18c-6-10-14-6-10 0M30 18c6-10 14-6 10 0" stroke="rgba(200,102,75,.8)" stroke-width="3" fill="none"/></svg>`
];
const LOCK = `<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>`;
const STATUS_TEXT = { done:"✓ сделали", inspired:"✨ вдохновились", later:"на потом" };

/* Даты: ячейки открываются по часовому поясу CONFIG.timeZone, независимо от устройства */
const [sy, sm, sd] = CONFIG.startDate.split("-").map(Number);
function dayDate(n){ return new Date(Date.UTC(sy, sm - 1, sd + n - 1)); }
function iso(d){ return d.toISOString().slice(0,10); }
function todayISO(){
  try{ return new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.timeZone,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
  catch(e){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
}
const isUnlocked = n => preview || iso(dayDate(n)) <= todayISO();
const isToday = n => iso(dayDate(n)) === todayISO();
const isWeekend = n => [0,6].includes(dayDate(n).getUTCDay());
const fmt = d => d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"});
const wd = d => d.toLocaleDateString("ru-RU",{weekday:"long",timeZone:"UTC"});

function shuffled(n){
  const a = Array.from({length:n},(_,i)=>i+1); let s = 20261201;
  const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function render(){
  $("brand").textContent = CONFIG.brand;
  $("title").innerHTML = CONFIG.title;
  $("lead").textContent = CONFIG.lead;
  $("footText").textContent = CONFIG.footer;
  $("legend").innerHTML = Object.values(CATEGORIES).map(c=>`<span class="chip"><span class="dot" style="background:${c.color}"></span>${c.name}</span>`).join("");
  $("previewWrap").innerHTML = preview ? `<div><span class="admin">Предпросмотр: открыты все ячейки</span></div>` : "";

  const grid = $("grid"); grid.innerHTML = "";
  shuffled(CONFIG.days).forEach((n, idx) => {
    const t = TASKS[n-1] || {title:`День ${n}`};
    const cat = CATEGORIES[t.category] || Object.values(CATEGORIES)[0];
    const unlocked = isUnlocked(n); const st = state.status[n];
    const b = document.createElement("button");
    b.className = "cell" + (CONFIG.bigCells.includes(n) ? " w2 h2" : CONFIG.wideCells.includes(n) ? " w2" : "")
      + (state.opened[n] ? " opened" : "") + (unlocked ? "" : " locked") + (isToday(n) && !state.opened[n] ? " today" : "");
    b.setAttribute("aria-label", `День ${n}: ${unlocked ? t.title : "ещё закрыт"}`);
    b.innerHTML = `
      <div class="inside"><span class="ttl">${t.title}</span>${st ? `<span class="badge ${st}">${STATUS_TEXT[st]}</span>` : ""}</div>
      <div class="door" style="background:${cat.color}">
        <span class="num">${n}</span><small>${fmt(dayDate(n))}</small>
        ${unlocked ? "" : LOCK}<span class="deco">${DECOS[(n+idx) % DECOS.length]}</span>
      </div>`;
    b.onclick = () => open(n, b);
    grid.appendChild(b);
  });

  const marked = Object.values(state.status).filter(v => v === "done" || v === "inspired").length;
  $("count").textContent = `Наш декабрь: ${marked} из ${CONFIG.days}`;
  $("bar").style.width = (marked / CONFIG.days * 100) + "%";
}

let current = null;
function open(n, el){
  if(!isUnlocked(n)){
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    toast(`Эта ячейка откроется ${fmt(dayDate(n))}. Немного терпения ✨`); return;
  }
  if(!state.opened[n]){ state.opened[n] = true; store.set(state); el.classList.add("opened"); el.classList.remove("today");
    setTimeout(()=>showModal(n), 550); } else showModal(n);
}

function showModal(n){
  current = n; const t = TASKS[n-1] || {}; const cat = CATEGORIES[t.category] || {};
  const d = dayDate(n);
  $("mDay").textContent = `День ${n} · ${fmt(d)}, ${wd(d)}`;
  $("mTitle").textContent = t.title || `День ${n}`;
  $("mMeta").innerHTML = [cat.name && `<span style="background:${cat.color}">${cat.name}</span>`, isWeekend(n) && `<span>☕ Задание выходного дня</span>`].filter(Boolean).join("");
  let html = `<div class="block b-task"><h4>Задание</h4><p>${t.task || '<span style="color:#6E7B73;font-style:italic">Текст задания появится здесь.</span>'}</p></div>`;
  if(t.light) html += `<div class="block b-light"><h4>Если сегодня мало сил</h4><p>${t.light}</p></div>`;
  if(t.why) html += `<div class="block b-why"><h4>Зачем это нужно</h4><p>${t.why}</p></div>`;
  if(t.bonus) html += `<div class="block b-bonus"><h4>Бонус дня</h4>${t.bonus}</div>`;
  if(t.material) html += `<div class="block b-mat"><span class="ic">🖨</span><div><b>${t.material}</b>${t.materialUrl ? `<a href="${t.materialUrl}" target="_blank" rel="noopener">Открыть шаблон →</a>` : `<span>Шаблон для печати появится здесь</span>`}</div></div>`;
  $("mBody").innerHTML = html;
  const a = ANSWERS[t.answer] || ANSWERS.note;
  $("mNoteLabel").textContent = a.label; $("mNote").placeholder = a.ph;
  $("mNote").value = state.notes[n] || "";
  updStatus();
  $("overlay").classList.add("show"); document.body.style.overflow = "hidden";
  document.querySelector(".modal").scrollTop = 0;
}
function updStatus(){ document.querySelectorAll(".st").forEach(b => b.setAttribute("aria-pressed", state.status[current] === b.dataset.s)); }
function closeModal(){ $("overlay").classList.remove("show"); document.body.style.overflow = ""; current = null; render(); }

document.querySelectorAll(".st").forEach(b => b.onclick = () => {
  const s = b.dataset.s;
  if(state.status[current] === s) delete state.status[current]; else state.status[current] = s;
  store.set(state); updStatus();
  if(state.status[current] === "done") toast("Отлично! Маленький шаг — большое тепло 💛");
  if(state.status[current] === "inspired") toast("Вдохновение — тоже отличный результат ✨");
  if(state.status[current] === "later") toast("Ячейка будет ждать вас, когда будет время");
});
$("mNote").oninput = e => { state.notes[current] = e.target.value; store.set(state); };
$("mClose").onclick = closeModal;
$("overlay").onclick = e => { if(e.target.id === "overlay") closeModal(); };
document.addEventListener("keydown", e => { if(e.key === "Escape" && current) closeModal(); });

let resetArmed = false;
$("resetBtn").onclick = () => {
  const btn = $("resetBtn");
  if(!resetArmed){ resetArmed = true; btn.textContent = "Точно удалить все отметки и заметки? Нажмите ещё раз";
    setTimeout(()=>{ resetArmed=false; btn.textContent="Сбросить мои отметки и заметки"; },3500); return; }
  state = {opened:{},status:{},notes:{}}; store.set(state); resetArmed=false; btn.textContent="Сбросить мои отметки и заметки"; render(); toast("Готово, начинаем с чистого листа");
};
window.addEventListener("hashchange", () => location.reload());

let tt; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2600); }

render();
</script>
</body>
</html>
